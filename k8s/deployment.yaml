apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-gitops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-gitops-app
  template:
    metadata:
      labels:
        app: python-gitops-app
    spec:
      containers:
        - name: python-gitops-app
          image: ghcr.io/betkibet/devops-playbook:ae7c01b65458f777ba930dc0aab2cea966217e82
          ports:
            - containerPort: 8000